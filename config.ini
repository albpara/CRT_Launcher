; CRT Launcher POC configuration.
; Edit values, then just relaunch the app -- no rebuild needed.

[display]
; The "low resolution" mode CRT Emudriver exposes on the real cabinet.
; On a normal desktop GPU this mode almost certainly won't exist -- the app
; will log a warning and fall back to a windowed surface at this exact
; pixel size instead of crashing.
width=320
height=240
refresh_rate=60

[input]
; Key that toggles between the low-res mode and the desktop's native
; resolution. Must be a name SDL_GetKeyFromName() understands, e.g.
; F1-F12, A-Z, 0-9, Space, Escape, Tab, etc.
toggle_hotkey=F5

; How holding Up/Down/Left/Right to navigate the game list repeats --
; the app times this itself rather than relying on Windows' keyboard
; repeat setting, so it's actually tunable here.
; nav_repeat_delay_ms: how long a direction must be held before it starts
;   repeating (first press always moves once immediately either way).
; nav_repeat_interval_ms: time between repeats once it's repeating --
;   lower = faster scrolling through the list.
nav_repeat_delay_ms=250
nav_repeat_interval_ms=40

[launchbox]
; Optional path to a LaunchBox install root -- the folder that contains
; LaunchBox.exe and a Data subfolder (e.g. C:\LaunchBox or E:\LaunchBox).
; Pointing at the install root rather than one export file means the same
; setting can later be reused to read Data\Emulators.xml when this becomes
; a real launcher. If set, the POC scans every *.xml file directly inside
; "<launchbox_dir>\Data\Platforms" -- nothing else under the install is
; ever read -- for a game count and the first <Title> found, so there's
; real data on screen instead of only static status text. This is NOT the
; real LaunchBox import pipeline (no full XML parsing, no game-list UI
; yet); leave blank to skip it entirely.
;
; If left blank, the app also tries to auto-detect a LaunchBox install as a
; sibling of its own folder before giving up -- e.g. if this exe lives in
; "Cabinet\CRT Launcher\crt_launcher.exe", it checks
; "Cabinet\LaunchBox\Data\Platforms" and uses "Cabinet\LaunchBox" if that
; folder exists. Set this explicitly if your LaunchBox install lives
; somewhere else.
launchbox_dir=

; No [bindings] section here on purpose -- its absence is exactly what
; tells the app "this install has never been calibrated," which makes it
; drop straight into the calibration flow (CALIBRATE CONTROLS) on next
; launch instead of the game list. Once you calibrate once (from the
; system menu -- scroll up past your favorites/games to find it, it's
; hidden by default), the app writes a [bindings] section here itself:
;   up=KEYBOARD Up
;   down=KEYBOARD Down
;   left=KEYBOARD Left
;   right=KEYBOARD Right
;   select=KEYBOARD Return
;   back=KEYBOARD Escape
;   modifier=KEYBOARD Left Shift
; (or JOYBUTTON <index> / JOYHAT <hat> <UP|DOWN|LEFT|RIGHT> / JOYAXIS <axis>
; <POSITIVE|NEGATIVE> for a controller -- which one depends on how your
; encoder reports directions; the calibration flow figures out which for
; you). SELECT launches; MODIFIER held while pressing SELECT opens
; the version picker instead. Re-running calibration overwrites the whole
; section; hand-editing it directly works too as long as the format above
; is kept.
