; CRT Launcher configuration. Edit values, then relaunch -- no rebuild
; needed.

[display]
; The low-res mode CRT Emudriver exposes on the cabinet. On a normal
; desktop GPU this mode won't exist and the app falls back to a window of
; the same pixel size.
width=320
height=240
refresh_rate=60

; What's drawn behind the game list: "checkerboard" (the default, also
; used if this is missing or unrecognized) or "starfield" -- the Galaga
; one, same as the screensaver.
background=checkerboard

; UI font: "compact" (the default, also used if this is missing or
; unrecognized) -- the 5x5 set -- or "galaga88", 7x7 lifted from the
; Galaga '88 PC Engine ROM, which fits about a quarter less text per row.
font=compact

; Idle seconds before the Galaga starfield screensaver kicks in (CRT
; burn-in protection). Any input wakes it without acting on the list.
; 0 disables.
screensaver_timeout_seconds=60

[input]
; Key that toggles low-res <-> desktop resolution. Any name
; SDL_GetKeyFromName() understands (F1-F12, A-Z, Space, ...).
toggle_hotkey=F5

; Held-direction repeat, timed by the app itself: delay before repeating
; starts, interval between repeats (lower = faster).
nav_repeat_delay_ms=250
nav_repeat_interval_ms=40

[launchbox]
; LaunchBox install root (the folder with LaunchBox.exe and Data\).
; Leave blank to auto-detect an install that is a sibling of this exe's
; folder. Only Data\Platforms\*.xml and Data\Emulators.xml are ever read.
launchbox_dir=

; Which platforms' games are listed: "All", "None", or comma-separated
; names matching the Data\Platforms XML filenames (e.g. "Arcade,SNES").
; Toggling a platform checkbox in-app rewrites this line automatically.
selected_platforms=All

; No [bindings] section on purpose -- its absence makes the app start in
; the calibration flow (CALIBRATE CONTROLS), which then writes it here:
;   up=KEYBOARD Up | JOYBUTTON <n> | JOYHAT <hat> <dir> | JOYAXIS <axis> <dir>
;   ... one line per action: up/down/left/right/select/back/modifier.
; Recalibrating overwrites the whole section; hand-editing works too.
